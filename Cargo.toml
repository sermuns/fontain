[package]
name = "fontain"
version = "0.1.2"
edition = "2024"
license = "WTFPL"
repository = "https://github.com/sermuns/fontain"
description = "cli font installer/downloader"

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
dirs = "6"
either = "1"
futures-concurrency = "7"
indicatif = "0.18"
isahc = { version = "2", features = ["json"] }
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
zip = "8"
